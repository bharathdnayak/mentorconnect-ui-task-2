# Render Blueprint for MentorConnect Express API Web Service
# Zero-cost configuration: Free tier Web Service connecting to Neon Free PostgreSQL

services:
  - type: web
    name: mentorconnect-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npm run build:api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRATION
        value: 1h
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: CORS_ORIGIN
        sync: false

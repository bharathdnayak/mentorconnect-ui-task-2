# Render Blueprint for MentorConnect Full-Stack Application
# Backend Web Service + Render PostgreSQL Database

services:
  - type: web
    name: mentorconnect-api
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build -w packages/shared && npm run build -w apps/api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mentorconnect-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRATION
        value: 1h
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: mentorconnect-db
    databaseName: mentorconnect
    user: mentorconnect_user
    plan: free
    postgresMajorVersion: 16
